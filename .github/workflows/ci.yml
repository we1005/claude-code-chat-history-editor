name: Editor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:core
      - run: pnpm --filter @claude-sessions/core typecheck
      - run: pnpm --filter @claude-sessions/core test
      - run: pnpm --filter @claude-sessions/web typecheck
      - run: pnpm --filter @claude-sessions/web test
      - run: pnpm build:web
      - run: pnpm --filter @claude-sessions/web exec playwright install chromium --with-deps
      - run: pnpm test:editor
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: isolated-editor-test-results
          path: .editor-test/
          include-hidden-files: true
          retention-days: 7
